// The cell API, served by cell-agent on port 443 of every cell (SPEC.md "Interfaces").
//
// Transport: gRPC over TLS 1.3 with the cell certificate the customer's verifier issued
// (SAN <subenv>.<env>.cells.clovelly.internal, chaining to the environment CA). The SDK
// dials the cell's forwarding-rule address with that name as the TLS server name and
// HTTP/2 authority, pins the environment CA, and sends nothing until the handshake has
// verified the certificate. One connection per cell carries every sandbox's streams.
//
// Sandboxes. A sandbox is a gVisor container on the cell, named by a sandbox id: 32
// lowercase hex characters from a CSPRNG, which the control plane hands out with the
// placement. The id is not a secret (the control plane knows it), so the SDK also
// chooses a 32-byte access key at create time and presents it on every later call for
// that sandbox; the cell keeps only its SHA-256 and the control plane never sees it.
//
// Errors. A refused call ends with a gRPC status whose trailing metadata key
// "clovelly-error" holds one ErrorReason name (for example "CAPACITY"); the message is
// for people. The SDKs raise one typed error per reason.
syntax = "proto3";

package clovelly.cell.v1;

service Cell {
  // Starts a sandbox with the given size and timeout, if it fits this cell.
  rpc CreateSandbox(CreateSandboxRequest) returns (CreateSandboxResponse);
  // Runs a process in a sandbox. The first request is ExecStart; later ones carry
  // stdin. Responses stream stdout and stderr and end with ExecExit.
  rpc Exec(stream ExecRequest) returns (stream ExecResponse);
  // Streams a file's contents out of a sandbox.
  rpc ReadFile(ReadFileRequest) returns (stream FileChunk);
  // Writes a file in a sandbox. The first request is the header, then data.
  rpc WriteFile(stream WriteFileRequest) returns (WriteFileResponse);
  // Ends a sandbox (exit kind "killed") and returns its receipt.
  rpc Kill(KillRequest) returns (Receipt);
  // A sandbox's signed receipt: interim while it runs, final once it has ended.
  rpc GetReceipt(GetReceiptRequest) returns (Receipt);
  // Control plane only (mutual TLS with the control-plane CA baked into the image):
  // stop accepting sandboxes, let running ones end, then ask to be recycled. Carries no
  // content.
  rpc Drain(DrainRequest) returns (DrainResponse);
}

// The names carried in the "clovelly-error" trailer.
enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  // INVALID_ARGUMENT: the sandbox id is not 32 lowercase hex characters. Never passed
  // to runsc.
  INVALID_SANDBOX_ID = 1;
  // INVALID_ARGUMENT: a malformed request (zero size, empty argv, missing header).
  INVALID_REQUEST = 2;
  // NOT_FOUND: no sandbox with this id on this cell.
  NO_SUCH_SANDBOX = 3;
  // PERMISSION_DENIED: the access key does not match the sandbox's, or a Drain without
  // the control plane's client certificate.
  PERMISSION = 4;
  // ALREADY_EXISTS: a sandbox with this id exists on this cell.
  SANDBOX_EXISTS = 5;
  // RESOURCE_EXHAUSTED: the request does not fit the cell's unreserved CPU or memory.
  CAPACITY = 6;
  // INVALID_ARGUMENT: above the sub-environment policy's maximum cpu, memory or
  // timeout.
  ABOVE_POLICY_MAXIMUM = 7;
  // FAILED_PRECONDITION: now + timeout is after the cell's end (its cap).
  CROSSES_CELL_END = 8;
  // FAILED_PRECONDITION: now + timeout is not before the release's valid_until.
  CROSSES_RELEASE_EXPIRY = 9;
  // UNAVAILABLE: the cell is draining or recycling and takes no new sandboxes.
  DRAINING = 10;
  // UNAVAILABLE: the cell's key lease ended; it has ended every sandbox.
  REVOKED = 11;
  // FAILED_PRECONDITION: the sandbox has ended.
  SANDBOX_ENDED = 12;
  // NOT_FOUND: ReadFile on a path that does not exist or is not readable.
  NO_SUCH_FILE = 13;
  // INTERNAL: runsc failed.
  RUNTIME = 14;
  // FAILED_PRECONDITION: the cell holds no policy bundle it can accept for this
  // sub-environment (bad signature, wrong environment, expired, an older version than
  // the one in force, or an invalid destination); it creates no sandbox until the
  // verifier serves one it can.
  POLICY_REFUSED = 15;
  // UNAVAILABLE: a credential the policy names could not be fetched from the control
  // plane or did not open under the sub-environment DEK.
  CREDENTIAL_UNAVAILABLE = 16;
  // UNAVAILABLE: the template could not be fetched, did not open under the
  // sub-environment DEK, or its plaintext does not have the digest asked for.
  TEMPLATE_UNAVAILABLE = 17;
  // FAILED_PRECONDITION: another sandbox holds the volume's lease.
  VOLUME_BUSY = 18;
  // PERMISSION_DENIED: the volume's key does not open under this sub-environment's DEK
  // (it belongs to another sub-environment or environment), or its blocks fail their
  // authenticated manifest.
  VOLUME_UNREADABLE = 19;
  // UNAVAILABLE: the volume's lease or blocks could not be reached.
  VOLUME_UNAVAILABLE = 20;
  // PERMISSION_DENIED: CreateSandbox without a placement pass the control plane issued for
  // this cell, sandbox, size and timeout, or with one expired or used before.
  PLACEMENT_REFUSED = 21;
}

// How a sandbox ended (the receipt's exit.kind).
enum ExitKind {
  EXIT_KIND_UNSPECIFIED = 0;
  // Still running (interim receipts).
  EXIT_KIND_RUNNING = 1;
  // Its main process exited on its own.
  EXIT_KIND_EXITED = 2;
  // Kill, or runsc lost it.
  EXIT_KIND_KILLED = 3;
  // It reached its timeout.
  EXIT_KIND_TIMEOUT = 4;
  // Ended by a drain.
  EXIT_KIND_DRAINED = 5;
  // The cell's key lease ended without a successful renewal.
  EXIT_KIND_REVOKED = 6;
  // The cell was lost (phase 4: the last-will receipt).
  EXIT_KIND_CELL_LOST = 7;
  // Still running at the cell's end, which the placement rule forbids: a bug.
  EXIT_KIND_CELL_END = 8;
}

message CreateSandboxRequest {
  // From PlaceSandbox.
  string sandbox_id = 1;
  // 32 random bytes chosen by the SDK.
  bytes access_key = 2;
  // vCPUs in halves (2 is one vCPU) and GiB. Both nonzero.
  uint32 cpu_halves = 3;
  uint32 memory_gib = 4;
  // Seconds, 1 to 86400 and within the policy's maximum.
  uint32 timeout_secs = 5;
  // The sandbox's main process (argv). Empty: an idle process, and the sandbox lives
  // until Kill or its timeout. When the main process exits, the sandbox ends with exit
  // kind EXITED and its status.
  repeated string command = 6;
  map<string, string> env = 7;
  // The template's root (SHA-256 of the template plaintext, lowercase hex) as the
  // sandbox's read-only lower layer; empty: the base bundle. The cell fetches and
  // decrypts it once and checks the digest; every sandbox from it shares that copy.
  string template_digest = 8;
  // A persistent volume of this sub-environment, mounted at /volume: 1-64 of a-z, 0-9,
  // '_', '-'; empty: none. Created on first use with volume_gib (1 to 20, default 1).
  string volume = 9;
  uint32 volume_gib = 10;
  // The placement's pass, from PlaceSandbox (Placement.placement_pass): the control plane's
  // signature over this cell, this sandbox id, this size and timeout. A cell that has a
  // control plane creates nothing without one (PLACEMENT_REFUSED), and takes each once.
  string placement_pass = 11;
}

message CreateSandboxResponse {
  // Unix milliseconds when runsc create was called.
  uint64 started_unix_ms = 1;
  // Milliseconds spent in runsc create and start.
  uint32 runsc_ms = 2;
}

message ExecRequest {
  oneof msg {
    ExecStart start = 1;
    bytes stdin = 2;
    // Closes the process's stdin.
    bool stdin_eof = 3;
  }
}

message ExecStart {
  string sandbox_id = 1;
  bytes access_key = 2;
  // argv, run directly (no shell).
  repeated string args = 3;
  map<string, string> env = 4;
  // Working directory; empty is "/".
  string cwd = 5;
  // Kills the process after this many seconds; 0 means only the sandbox's timeout.
  uint32 timeout_secs = 6;
}

message ExecResponse {
  oneof msg {
    bytes stdout = 1;
    bytes stderr = 2;
    // Always the last message.
    ExecExit exit = 3;
  }
}

message ExecExit {
  // The exit status, or 128 + signal.
  int32 code = 1;
  // For the sandbox's first exec only: milliseconds from the sandbox's runsc create
  // call to this exec's first stdout byte (phase 0's create-to-first-exec, measured in
  // the cell). 0 otherwise.
  uint32 first_exec_ms = 2;
  // Set when the sandbox itself ended while this exec ran.
  ExitKind sandbox_ended = 3;
}

message ReadFileRequest {
  string sandbox_id = 1;
  bytes access_key = 2;
  string path = 3;
}

message FileChunk {
  bytes data = 1;
}

message WriteFileRequest {
  oneof msg {
    WriteFileHeader header = 1;
    bytes data = 2;
  }
}

message WriteFileHeader {
  string sandbox_id = 1;
  bytes access_key = 2;
  // Absolute path; the parent directory must exist.
  string path = 3;
}

message WriteFileResponse {
  uint64 bytes_written = 1;
}

message KillRequest {
  string sandbox_id = 1;
  bytes access_key = 2;
}

message GetReceiptRequest {
  string sandbox_id = 1;
  bytes access_key = 2;
}

message Receipt {
  // The receipt (SPEC.md "Receipt"): JSON already in its JCS canonical form, so these
  // are exactly the bytes signed.
  bytes json = 1;
  // ECDSA P-256 with SHA-256 over json, by the cell key: r || s, 64 bytes.
  bytes signature = 2;
  ExitKind exit_kind = 3;
  // The cell certificate (DER) whose key signed it; it chains to the environment CA.
  bytes cell_cert = 4;
  // Set once the sandbox has ended: no later receipt for it will follow.
  bool final = 5;
}

message DrainRequest {}

message DrainResponse {
  // Sandboxes still running; the cell asks to be recycled once this reaches zero.
  uint32 sandboxes = 1;
}
