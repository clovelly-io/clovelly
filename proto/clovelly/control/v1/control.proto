// The control plane's APIs (SPEC.md "The control plane"). It never receives content:
// the SDK asks it where to put a sandbox and talks to the cell for everything else.
//
// Control: customer-facing (and operator) gRPC over TLS on the control plane's public
// address. Every call carries "authorization: Bearer <token>": an API key of that
// environment (the token PutEnvironment returns is its first), a console token, or the
// operator token for any. Calls marked "operator" refuse the others. A read_only key
// reads and does not change anything. See the Account service below.
//
// CellChannel: cells report to the control plane over TLS on its internal address; the
// cell verifies the control plane's certificate against the control-plane CA baked
// into the image. A report carries exactly the fixed telemetry set (SPEC.md
// "Telemetry") and who is reporting.
//
// Errors end with a gRPC status whose trailing metadata "clovelly-error" holds one
// ErrorReason name.
syntax = "proto3";

package clovelly.control.v1;

service Control {
  // Operator: creates or updates an environment and issues it a new token (the
  // previous one stops working).
  rpc PutEnvironment(PutEnvironmentRequest) returns (PutEnvironmentResponse);
  // Creates or updates a sub-environment and its sandbox limits.
  rpc PutSubenvironment(Subenvironment) returns (Subenvironment);
  // Creates or updates a sub-environment's pool. Machine type, release and test
  // metadata are operator fields; an environment token leaves them as they are.
  rpc PutPool(Pool) returns (Pool);
  rpc GetPool(GetPoolRequest) returns (PoolStatus);
  // Picks a cell for a new sandbox, booting one when none can hold it (cold).
  rpc PlaceSandbox(PlaceSandboxRequest) returns (Placement);
  // Where an existing sandbox lives, for reconnecting by id.
  rpc LocateSandbox(LocateSandboxRequest) returns (Placement);
  // The SDK closed the sandbox: its capacity is free again. Best effort; a sandbox's
  // capacity is also freed by its timeout and by the cell's reports.
  rpc ReleaseSandbox(ReleaseSandboxRequest) returns (ReleaseSandboxResponse);
  // Operator: asks a cell to drain (mutual TLS to the cell's Drain).
  rpc DrainCell(DrainCellRequest) returns (DrainCellResponse);
  // Cell-minutes billed to a sub-environment in [from, to).
  rpc GetUsage(GetUsageRequest) returns (Usage);
  // Stores a sealed credential (ciphertext from the customer's verifier) for a
  // sub-environment's cells, replacing one of the same name.
  rpc PutCredential(PutCredentialRequest) returns (PutCredentialResponse);
  // Stores a template: the first message is the header, then its ciphertext in order
  // (common::template's chunked format, which the SDK made under a key it got from the
  // customer's verifier). Ciphertext only; the control plane cannot open it.
  rpc PutTemplate(stream PutTemplateRequest) returns (PutTemplateResponse);
  // The digest of a sub-environment's template by name.
  rpc GetTemplate(GetTemplateRequest) returns (TemplateInfo);
  // Deletes a template's name and, if no other name uses it, its ciphertext. Ciphertext
  // is kept until its customer deletes it or leaves (docs/retention.md).
  rpc DeleteTemplate(GetTemplateRequest) returns (DeletedObjects);
  // Deletes a volume's ciphertext; refused (VOLUME_BUSY) while a sandbox holds its lease.
  rpc DeleteVolume(DeleteVolumeRequest) returns (DeletedObjects);
  // Operator: sets an environment's quotas.
  rpc PutQuota(Quota) returns (Quota);
  // An environment's quotas and what it uses now.
  rpc GetQuota(GetQuotaRequest) returns (QuotaStatus);
  // Operator: a planned drain of one zone. No new cell or placement goes there from now
  // on; replacements boot in the pools' other zones, then the zone's cells drain.
  rpc DrainZone(DrainZoneRequest) returns (DrainZoneResponse);
  // Operator: puts a drained or lost zone back in service.
  rpc RestoreZone(DrainZoneRequest) returns (DrainZoneResponse);
  // One calendar month's billing for an environment, per cell and per sub-environment.
  rpc ExportBilling(ExportBillingRequest) returns (BillingExport);
  // Operator: a customer leaves. Refuses new work, recycles its cells, deletes all of its
  // ciphertext and every record of it here. Returns what went, for the deletion receipt.
  rpc OffboardEnvironment(OffboardRequest) returns (OffboardResponse);
}

service CellChannel {
  rpc Report(CellReport) returns (CellReportAck);
  // The sealed credentials of the reporting cell's sub-environment with these names;
  // a name with none stored is left out. Ciphertext only.
  rpc FetchCredentials(FetchCredentialsRequest) returns (FetchCredentialsResponse);
  // Where the reporting cell's sub-environment keeps its ciphertext (templates and
  // volumes) in Cloud Storage; the cell reads and writes those objects itself.
  rpc GetStorage(GetStorageRequest) returns (Storage);
  // Takes a volume's single-mounter lease for one sandbox: refused (VOLUME_BUSY) while
  // another sandbox holds it. A lease ends at ReleaseVolume or when its cell is gone.
  rpc AcquireVolume(AcquireVolumeRequest) returns (AcquireVolumeResponse);
  rpc ReleaseVolume(ReleaseVolumeRequest) returns (ReleaseVolumeResponse);
}

enum ErrorReason {
  ERROR_REASON_UNSPECIFIED = 0;
  // UNAUTHENTICATED / PERMISSION_DENIED.
  UNAUTHENTICATED = 1;
  PERMISSION = 2;
  // INVALID_ARGUMENT.
  INVALID_REQUEST = 3;
  // NOT_FOUND.
  NO_SUCH_ENVIRONMENT = 4;
  NO_SUCH_SUBENVIRONMENT = 5;
  NO_SUCH_POOL = 6;
  NO_SUCH_SANDBOX = 7;
  NO_SUCH_CELL = 8;
  // INVALID_ARGUMENT: cpu, memory or timeout above the sub-environment's maximum.
  ABOVE_POLICY_MAXIMUM = 9;
  // FAILED_PRECONDITION: no cell of this pool could ever hold the request (larger than
  // a cell, or a timeout past a fresh cell's cap or its release's valid_until).
  NO_CELL_CAN_HOLD = 10;
  // UNAVAILABLE: a cell was booted but none became ready before the deadline.
  NO_CELL_READY = 11;
  // UNAVAILABLE: the Compute API refused to create a cell.
  CELL_CREATE_FAILED = 12;
  // UNAVAILABLE: the ciphertext store could not be written or read.
  STORAGE = 13;
  // NOT_FOUND.
  NO_SUCH_TEMPLATE = 14;
  // FAILED_PRECONDITION: another sandbox holds the volume's lease.
  VOLUME_BUSY = 15;
  // RESOURCE_EXHAUSTED: the environment is at a quota (cells, sandboxes or volume
  // bytes). Refused at once, never queued; the message names the quota.
  QUOTA_EXCEEDED = 16;
  // FAILED_PRECONDITION: the organization has no credit, no card on file or a failed
  // charge past its grace, so nothing new is placed. Running sandboxes finish; credit
  // added resumes placements within a minute. The message says which.
  CREDIT_EXHAUSTED = 17;
  // UNAVAILABLE: the control plane cannot answer now; try again (never "your key is wrong").
  NOT_READY = 18;
  // PERMISSION_DENIED: the sign-up is closed.
  SIGN_UP_CLOSED = 19;
}

message PutEnvironmentRequest {
  // A DNS label.
  string env_id = 1;
  // The customer's verifier, which cells of this environment unlock against.
  string verifier_url = 2;
  // The environment CA certificate (PEM, public), for the control plane's Drain calls.
  // Several certificates while the CA rotates (docs/key-rotation.md).
  string ca_pem = 3;
  // Updates an existing environment and leaves its token as it is; the response's token
  // is then empty.
  bool keep_token = 4;
}

message PutEnvironmentResponse {
  // The environment's new token; the control plane keeps only its SHA-256.
  string token = 1;
}

message Resources {
  // vCPUs in halves (2 is one vCPU) and GiB.
  uint32 cpu_halves = 1;
  uint32 memory_gib = 2;
}

message Subenvironment {
  string env_id = 1;
  string subenv_id = 2;
  // The policy bundle's sandbox limits, which the control plane checks before placing
  // (the cell checks the signed bundle's own).
  Resources default_size = 3;
  Resources max_size = 4;
  uint32 max_timeout_secs = 5;
  // A verifier for this sub-environment's cells other than the environment's (test
  // deployments); empty uses the environment's.
  string verifier_url = 6;
}

message Pool {
  string env_id = 1;
  string subenv_id = 2;
  // Operator: e.g. "c3-standard-8".
  string machine_type = 3;
  repeated string zones = 4;
  uint32 min_warm_per_zone = 5;
  uint32 idle_window_secs = 6;
  // At most 48 hours.
  uint32 cap_secs = 7;
  // Operator: the release new cells boot (one of the control plane's releases).
  string release_id = 8;
  // Operator, test deployments only: extra instance metadata for test-variant cells.
  map<string, string> test_metadata = 9;
}

message GetPoolRequest {
  string env_id = 1;
  string subenv_id = 2;
}

message PoolStatus {
  Pool pool = 1;
  repeated CellStatus cells = 2;
}

message CellStatus {
  string cell_id = 1;
  string zone = 2;
  string instance_name = 3;
  // creating, booting, ready, draining, deleting, deleted, failed.
  string state = 4;
  string address = 5;
  string release_id = 6;
  uint64 create_called_unix_ms = 7;
  uint64 ready_unix_ms = 8;
  uint64 deleted_unix_ms = 9;
  uint64 cell_end_unix = 10;
  uint32 sandbox_count = 11;
  Resources unreserved = 12;
  string recycle_reason = 13;
  string forwarding_rule = 14;
}

message PlaceSandboxRequest {
  string env_id = 1;
  string subenv_id = 2;
  // Zero fields take the sub-environment's defaults (timeout: 900 s).
  Resources size = 3;
  uint32 timeout_secs = 4;
  // Cells that refused this request; placement avoids them.
  repeated string avoid_cells = 5;
}

message Placement {
  string sandbox_id = 1;
  string cell_id = 2;
  // host:port of the cell's forwarding rule.
  string cell_address = 3;
  string env_id = 4;
  string subenv_id = 5;
  // A cell had to be booted for this request.
  bool cold = 6;
  // The size and timeout placed, defaults filled in.
  Resources size = 7;
  uint32 timeout_secs = 8;
}

message LocateSandboxRequest {
  string sandbox_id = 1;
}

message ReleaseSandboxRequest {
  string sandbox_id = 1;
}

message ReleaseSandboxResponse {}

message DrainCellRequest {
  string cell_id = 1;
}

message DrainCellResponse {
  uint32 sandboxes = 1;
}

message GetUsageRequest {
  string env_id = 1;
  string subenv_id = 2;
  uint64 from_unix = 3;
  // 0: now.
  uint64 to_unix = 4;
}

message Usage {
  // From each cell's create call to its deletion, clipped to the window.
  double cell_minutes = 1;
  repeated CellUsage cells = 2;
}

message CellUsage {
  string cell_id = 1;
  uint64 create_called_unix_ms = 2;
  // 0 while the cell exists.
  uint64 deleted_unix_ms = 3;
  double cell_minutes = 4;
}

enum DrainState {
  DRAIN_STATE_UNSPECIFIED = 0;
  SERVING = 1;
  DRAINING = 2;
  // The cell asks to be recycled: drained, at its cap, or its lease ended.
  RECYCLE = 3;
}

message CellReport {
  // Who reports (instance metadata; the control plane matches it to its own record).
  uint64 instance_id = 1;
  string zone = 2;
  // The fixed set.
  bool ready = 3;
  uint32 unreserved_cpu_halves = 4;
  uint32 unreserved_memory_gib = 5;
  uint32 sandbox_count = 6;
  // Aggregate CPU of all sandboxes over the last interval, in thousandths of a vCPU,
  // and their memory in use.
  uint32 cpu_in_use_millis = 7;
  uint64 memory_in_use_bytes = 8;
  uint64 lease_expiry_unix = 9;
  uint32 proxy_connections = 10;
  DrainState drain_state = 11;
  string release_id = 12;
}

message CellReportAck {}

message PutCredentialRequest {
  string env_id = 1;
  string subenv_id = 2;
  // The credential's name; must equal the name inside sealed.
  string name = 3;
  // SealCredentialResponse.sealed from the customer's verifier.
  bytes sealed = 4;
}

message PutCredentialResponse {}

message FetchCredentialsRequest {
  // Who asks (instance metadata; the control plane matches it to its own record).
  uint64 instance_id = 1;
  string zone = 2;
  repeated string names = 3;
}

message SealedCredential {
  string name = 1;
  bytes sealed = 2;
}

message FetchCredentialsResponse {
  repeated SealedCredential credentials = 1;
}

message PutTemplateRequest {
  oneof msg {
    TemplateHeader header = 1;
    bytes data = 2;
  }
}

message TemplateHeader {
  string env_id = 1;
  string subenv_id = 2;
  // 1-64 of a-z, 0-9, '_', '-', '.'; a later upload with the same name replaces it.
  string name = 3;
  // SHA-256 of the plaintext, lowercase hex.
  string digest = 4;
  // SealTemplateKeyResponse.sealed_key from the customer's verifier.
  bytes sealed_key = 5;
  // Plaintext bytes (informational, for the cell's cache accounting).
  uint64 plaintext_bytes = 6;
}

message PutTemplateResponse {
  TemplateInfo template = 1;
}

message GetTemplateRequest {
  string env_id = 1;
  string subenv_id = 2;
  string name = 3;
}

message TemplateInfo {
  string name = 1;
  string digest = 2;
  uint64 ciphertext_bytes = 3;
  uint64 plaintext_bytes = 4;
  // Ciphertext objects (64 MiB each, the last shorter).
  uint32 parts = 5;
}

message GetStorageRequest {
  uint64 instance_id = 1;
  string zone = 2;
}

// Objects live at gs://<bucket>/<prefix>/... : templates/<digest>/{meta.json,
// part-NNNNN} and volumes/<name>/{key.json, manifest.json, block-NNNNN-EEEEEEEEEE}.
message Storage {
  string bucket = 1;
  // "<ciphertext_prefix>/<env>/<subenv>", no trailing slash.
  string prefix = 2;
}

message AcquireVolumeRequest {
  uint64 instance_id = 1;
  string zone = 2;
  string volume = 3;
  string sandbox_id = 4;
}

message AcquireVolumeResponse {}

message ReleaseVolumeRequest {
  uint64 instance_id = 1;
  string zone = 2;
  string volume = 3;
  string sandbox_id = 4;
}

message ReleaseVolumeResponse {}

message DeleteVolumeRequest {
  string env_id = 1;
  string subenv_id = 2;
  string name = 3;
}

message DeletedObjects {
  uint64 objects = 1;
  uint64 bytes = 2;
}

// Zero in a limit means no limit.
message Quota {
  string env_id = 1;
  // Live cells of the environment, not counting cells draining or being deleted.
  uint32 max_cells = 2;
  // Sandboxes placed and not yet ended.
  uint32 max_sandboxes = 3;
  // Volume ciphertext in the store, checked when a volume is mounted.
  uint64 max_volume_bytes = 4;
}

message GetQuotaRequest {
  string env_id = 1;
}

message QuotaStatus {
  Quota quota = 1;
  uint32 cells = 2;
  uint32 sandboxes = 3;
  uint64 volume_bytes = 4;
}

message DrainZoneRequest {
  string zone = 1;
}

message DrainZoneResponse {
  // The zone's cells that will drain, and the replacements started elsewhere.
  uint32 cells = 1;
  uint32 replacements = 2;
}

message ExportBillingRequest {
  string env_id = 1;
  // "YYYY-MM", UTC.
  string month = 2;
}

message BillingExport {
  string env_id = 1;
  string month = 2;
  // Every cell billed in the month, clipped to it.
  repeated BilledCell cells = 3;
  repeated BilledSubenv subenvs = 4;
  uint64 billed_ms = 5;
  // The sum of subenvs' cents.
  uint64 total_cents = 6;
}

message BilledCell {
  string subenv_id = 1;
  string cell_id = 2;
  string machine_type = 3;
  string zone = 4;
  uint64 create_called_unix_ms = 5;
  // 0: the cell still exists; it is billed to the end of the month or to now.
  uint64 deleted_unix_ms = 6;
  uint64 billed_ms = 7;
}

message BilledSubenv {
  string subenv_id = 1;
  uint64 billed_ms = 2;
  // billed_ms at the control plane's price per cell-hour, rounded half up once per
  // sub-environment.
  uint64 cents = 3;
}

message OffboardRequest {
  string env_id = 1;
}

// What was deleted; the operator signs it as the deletion receipt.
message OffboardResponse {
  string env_id = 1;
  uint64 started_unix_ms = 2;
  uint64 finished_unix_ms = 3;
  uint32 cells_deleted = 4;
  uint64 objects_deleted = 5;
  uint64 bytes_deleted = 6;
  // SHA-256 (hex) over the deleted object names, sorted, each followed by a newline.
  string object_names_sha256 = 7;
  // The ciphertext prefix, listed after the deletion: the count must be zero.
  uint64 objects_remaining = 8;
  // Rows deleted from the control plane's database, by table.
  map<string, uint64> rows_deleted = 9;
}

// The customer's account: organizations, members, API keys, the usage and billing tables.
// Every call carries "authorization: Bearer <token>", one of three. An API key
// (clv_<env>_<random>), scoped to one environment, role read_write or read_only, does what a
// member of that role may do in that environment, and never an organization-wide mutation
// (members, billing, new environments). A console token, signed with a key the control plane
// holds, is a session token (reads, 8 hours), an action token (one action in one environment,
// 5 minutes, single use) or an identity token (SignIn and SignUp only, 5 minutes). The operator
// token does anything.
//
// A member's role decides what a console token may do: owner everything; admin every mutation
// but billing and members; developer keys and pools in the environments it is granted; read_only
// nothing that changes anything.
service Account {
  // Who the caller is: joins any invitation for its verified email and returns its
  // organization, if it has one. Identity token.
  rpc SignIn(SignInRequest) returns (SignInResponse);
  // Creates an organization with the caller as its owner, or puts the caller on the
  // waitlist. Identity token.
  rpc SignUp(SignUpRequest) returns (SignUpResponse);
  rpc GetOrg(GetOrgRequest) returns (Org);
  rpc DeleteOrg(DeleteOrgRequest) returns (DeleteOrgResponse);
  rpc ListAudit(ListAuditRequest) returns (ListAuditResponse);

  // Whether a verifier URL answers and serves this environment's CA.
  rpc CheckVerifier(CheckVerifierRequest) returns (CheckVerifierResponse);
  // Creates an environment in the caller's organization and issues its first API key.
  rpc CreateEnvironment(CreateEnvironmentRequest) returns (CreateEnvironmentResponse);
  rpc ListSubenvironments(EnvRequest) returns (ListSubenvironmentsResponse);
  rpc ListPlacements(EnvRequest) returns (ListPlacementsResponse);
  rpc ListCells(EnvRequest) returns (ListCellsResponse);
  rpc ListTemplates(EnvRequest) returns (ListTemplatesResponse);
  // A month of cell-minutes per sub-environment and day, and the peak of concurrent
  // sandboxes per day.
  rpc GetDailyUsage(GetDailyUsageRequest) returns (DailyUsage);

  rpc ListKeys(EnvRequest) returns (ListKeysResponse);
  // The plaintext appears in this response once; only its SHA-256 is stored.
  rpc CreateKey(CreateKeyRequest) returns (CreateKeyResponse);
  rpc RevokeKey(RevokeKeyRequest) returns (RevokeKeyResponse);

  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  // Sends an invitation by email; inviting the same email again sends it again.
  rpc InviteMember(InviteMemberRequest) returns (Invitation);
  rpc RevokeInvitation(RevokeInvitationRequest) returns (RevokeInvitationResponse);
  rpc SetMember(SetMemberRequest) returns (Member);
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);

  rpc GetBilling(GetBillingRequest) returns (Billing);
  // Stripe's hosted page that saves a card.
  rpc CardSetup(CardSetupRequest) returns (HostedPage);
  // Asks Stripe whether a card is saved; the first one starts billing.
  rpc ConfirmCard(ConfirmCardRequest) returns (Billing);
  // Stripe's portal: the card and each charge's receipt.
  rpc BillingPortal(CardSetupRequest) returns (HostedPage);
  // Charges the card for credit, at least $10, once per request id.
  rpc BuyCredit(BuyCreditRequest) returns (Billing);
  rpc SetAutoRecharge(SetAutoRechargeRequest) returns (Billing);
  // Stripe's webhook, forwarded unread by the console. Authenticated by its signature.
  rpc StripeWebhook(StripeWebhookRequest) returns (StripeWebhookResponse);
}

message SignInRequest {}
message SignInResponse {
  // Empty when the caller belongs to no organization yet.
  string org_id = 1;
  string role = 2;
  // "open", "closed" or "waitlisted": what SignUp would do for this caller.
  string sign_up = 3;
}

message SignUpRequest {
  string org_name = 1;
  // The hex SHA-256 of the docs/terms.md the caller accepted.
  string terms_sha256 = 2;
}
message SignUpResponse {
  // Empty unless the organization was made.
  string org_id = 1;
  bool waitlisted = 2;
}

message GetOrgRequest {}
message EnvironmentSummary {
  string env_id = 1;
  string verifier_url = 2;
  uint64 created_unix_ms = 3;
}
message Org {
  string org_id = 1;
  string name = 2;
  // The caller's role: owner, admin, developer, read_only; read_write for a key.
  string role = 3;
  uint64 created_unix_ms = 4;
  repeated EnvironmentSummary environments = 5;
  // The environments a developer may change; empty for every other role.
  repeated string granted_envs = 6;
  bool card_on_file = 7;
  // Placements are refused now, and why: "no_card", "credit_exhausted", "charge_failed";
  // empty when they are not.
  string paused = 8;
}

message DeleteOrgRequest {}
message DeleteOrgResponse {}

message ListAuditRequest {
  uint32 limit = 1;
}
message AuditEvent {
  uint64 at_unix_ms = 1;
  string actor = 2;
  string action = 3;
  string target = 4;
  string detail_json = 5;
}
message ListAuditResponse {
  repeated AuditEvent events = 1;
}

message CheckVerifierRequest {
  string verifier_url = 1;
  string env_id = 2;
}
message CheckVerifierResponse {
  bool ok = 1;
  // For people: what failed.
  string problem = 2;
  // The environment CA the verifier serves.
  string ca_pem = 3;
}

message CreateEnvironmentRequest {
  // A DNS label; ids are global.
  string env_id = 1;
  string verifier_url = 2;
}
message CreateEnvironmentResponse {
  string env_id = 1;
  ApiKey key = 2;
  string key_plaintext = 3;
}

message EnvRequest {
  string env_id = 1;
}

message SubenvironmentRow {
  Subenvironment subenv = 1;
  // Unset until the sub-environment has a pool.
  Pool pool = 2;
}
message ListSubenvironmentsResponse {
  repeated SubenvironmentRow subenvs = 1;
}

message PlacementRow {
  string sandbox_id = 1;
  string subenv_id = 2;
  string cell_id = 3;
  Resources size = 4;
  uint64 placed_unix_ms = 5;
  uint64 expires_unix_ms = 6;
  // 0 while running.
  uint64 released_unix_ms = 7;
  bool cold = 8;
}
message ListPlacementsResponse {
  // Running first, then those released in the last 24 hours.
  repeated PlacementRow placements = 1;
}

// A cell and what it reports: nothing outside the fixed telemetry set.
message CellRow {
  string cell_id = 1;
  string subenv_id = 2;
  string state = 3;
  string zone = 4;
  string release_id = 5;
  uint32 sandbox_count = 6;
  uint32 cpu_in_use_millis = 7;
  uint64 memory_in_use_bytes = 8;
  uint64 lease_expiry_unix = 9;
  string drain_state = 10;
  uint64 reported_unix_ms = 11;
}
message ListCellsResponse {
  repeated CellRow cells = 1;
}

message TemplateRow {
  string subenv_id = 1;
  TemplateInfo template = 2;
  // 0 for a template uploaded before this was recorded.
  uint64 uploaded_unix_ms = 3;
}
message ListTemplatesResponse {
  repeated TemplateRow templates = 1;
}

message GetDailyUsageRequest {
  string env_id = 1;
  // YYYY-MM.
  string month = 2;
}
message DailyUsageRow {
  // YYYY-MM-DD, UTC.
  string day = 1;
  string subenv_id = 2;
  double cell_minutes = 3;
}
message DailySandboxes {
  string day = 1;
  uint32 peak_concurrent = 2;
}
message DailyUsage {
  repeated DailyUsageRow rows = 1;
  repeated DailySandboxes sandboxes = 2;
  // What the month's export bills, to the cent.
  uint64 total_cents = 3;
}

message ApiKey {
  string key_id = 1;
  string env_id = 2;
  string name = 3;
  // read_write or read_only.
  string role = 4;
  // The first characters of the key, to recognise it by.
  string prefix = 5;
  string created_by = 6;
  uint64 created_unix_ms = 7;
  uint64 revoked_unix_ms = 8;
  // Coarse: batched every few minutes.
  uint64 last_used_unix_ms = 9;
}
message ListKeysResponse {
  repeated ApiKey keys = 1;
}
message CreateKeyRequest {
  string env_id = 1;
  string name = 2;
  string role = 3;
}
message CreateKeyResponse {
  ApiKey key = 1;
  string plaintext = 2;
}
message RevokeKeyRequest {
  string env_id = 1;
  string key_id = 2;
}
message RevokeKeyResponse {}

message Member {
  string user_id = 1;
  string email = 2;
  string role = 3;
  repeated string granted_envs = 4;
  uint64 joined_unix_ms = 5;
}
message Invitation {
  string invitation_id = 1;
  string email = 2;
  string role = 3;
  repeated string granted_envs = 4;
  uint64 sent_unix_ms = 5;
}
message ListMembersRequest {}
message ListMembersResponse {
  repeated Member members = 1;
  repeated Invitation invitations = 2;
}
message InviteMemberRequest {
  string email = 1;
  string role = 2;
  repeated string granted_envs = 3;
}
message RevokeInvitationRequest {
  string invitation_id = 1;
}
message RevokeInvitationResponse {}
message SetMemberRequest {
  string user_id = 1;
  string role = 2;
  repeated string granted_envs = 3;
}
message RemoveMemberRequest {
  string user_id = 1;
}
message RemoveMemberResponse {}

message CreditGrant {
  // period, bought or operator.
  string kind = 1;
  int64 amount_cents = 2;
  int64 left_cents = 3;
  uint64 granted_unix_ms = 4;
  uint64 expires_unix_ms = 5;
}
message Charge {
  // fee, top_up or recharge.
  string kind = 1;
  int64 amount_cents = 2;
  // pending, open, paid or failed.
  string status = 3;
  // Stripe's page to pay it; empty once paid.
  string pay_url = 4;
  uint64 created_unix_ms = 5;
  uint64 failed_unix_ms = 6;
  uint64 paid_unix_ms = 7;
}
message Billing {
  // Below zero: owed, taken off the next credit.
  int64 balance_cents = 1;
  uint64 balance_unix_ms = 2;
  repeated CreditGrant credits = 3;
  repeated Charge charges = 4;
  bool card_on_file = 5;
  string card_summary = 6;
  // 0 before the card goes on file.
  uint64 period_start_unix_ms = 7;
  uint64 period_end_unix_ms = 8;
  int64 environment_fee_cents = 9;
  int64 low_balance_cents = 10;
  // 0: auto-recharge is off.
  int64 recharge_cents = 11;
  // As in Org.paused.
  string paused = 12;
}
message GetBillingRequest {}
message CardSetupRequest {
  // Where Stripe sends the customer back to.
  string return_url = 1;
}
message HostedPage {
  string url = 1;
}
message ConfirmCardRequest {}
message BuyCreditRequest {
  int64 cents = 1;
  // Once per id; the same id with another amount is refused.
  string request_id = 2;
}
message SetAutoRechargeRequest {
  int64 low_balance_cents = 1;
  // 0 turns it off; otherwise at least $10 and at least the low-balance level.
  int64 recharge_cents = 2;
}
message StripeWebhookRequest {
  bytes payload = 1;
  string signature = 2;
}
message StripeWebhookResponse {}
