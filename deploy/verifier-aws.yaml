# The verifier on AWS (docs/verifier-aws.md): one Fargate task holding the verifier and the key
# helper, sharing loopback, behind a network load balancer on your certificate. The task's role has no
# policy of its own: `clovelly-keys init aws` names it in the three keys' policies, and that is all
# it may do. There is no access key anywhere in this.
AWSTemplateFormatVersion: "2010-09-09"
Description: The Clovelly verifier and its key helper, one instance, always on.

Parameters:
  Env:
    Type: String
    Description: The environment id (a DNS label).
    AllowedPattern: "[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?"
  VerifierImage:
    Type: String
    Description: The published verifier image, by digest.
  KeysImage:
    Type: String
    Description: The published clovelly-keys image, by digest, or your own helper.
  CertificateArn:
    Type: String
    Description: An ACM certificate for the name your verifier will have.
  DesiredCount:
    Type: Number
    Description: 0 until the configuration is in Parameter Store (docs/verifier-aws.md), then 1. Never more.
    AllowedValues: [0, 1]
    Default: 1

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.77.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.77.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
  SubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.77.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
  RouteA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetA
      RouteTableId: !Ref RouteTable
  RouteB:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref SubnetB
      RouteTableId: !Ref RouteTable

  # The load balancer's traffic, and nothing else, reaches the verifier's port. The helper's port is
  # on loopback and in no security group.
  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: The gRPC port of the verifier, from inside this VPC
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 10.77.0.0/16

  # An NLB passes HTTP/2 through as it is. Its TLS listener ends TLS on your certificate and offers
  # only h2, which is what gRPC needs; the verifier speaks plain HTTP/2 behind it.
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: network
      Scheme: internet-facing
      Subnets: [!Ref SubnetA, !Ref SubnetB]
  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Protocol: TCP
      Port: 8080
      TargetType: ip
      VpcId: !Ref Vpc
      HealthCheckProtocol: TCP
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: TLS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      AlpnPolicy: [HTTP2Only]
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # What the helper runs as. No policies: the keys' own policies name it.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub clovelly-verifier-${Env}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
  # What ECS runs as to start the task: logs, and the three parameters.
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: start
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt LogGroup.Arn
              - Effect: Allow
                Action: ssm:GetParameters
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/clovelly/${Env}/*
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 90

  Cluster:
    Type: AWS::ECS::Cluster
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub clovelly-verifier-${Env}
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "1024"
      Memory: "2048"
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      TaskRoleArn: !GetAtt TaskRole.Arn
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: verifier
          Image: !Ref VerifierImage
          Essential: true
          PortMappings:
            - ContainerPort: 8080
          Environment:
            - Name: PORT
              Value: "8080"
            - Name: CLOVELLY_KEYS_URL
              Value: http://127.0.0.1:8200
          Secrets:
            - Name: CLOVELLY_CONFIG
              ValueFrom: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/clovelly/${Env}/config
            - Name: CLOVELLY_RELEASE_POLICY
              ValueFrom: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/clovelly/${Env}/release-policy
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: verifier
        - Name: keys
          Image: !Ref KeysImage
          Essential: true
          Command: [serve, aws]
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
          Secrets:
            - Name: CLOVELLY_KEYS_ALLOW
              ValueFrom: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/clovelly/${Env}/keys-allow
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: keys
  # Exactly one instance, always on: nonces and the receipt log are in its memory. A deployment stops
  # the old task before it starts the new one, so there is never a second.
  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      DeploymentConfiguration:
        MaximumPercent: 100
        MinimumHealthyPercent: 0
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref SubnetA, !Ref SubnetB]
          SecurityGroups: [!Ref TaskSecurityGroup]
      LoadBalancers:
        - ContainerName: verifier
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup

Outputs:
  TaskRoleArn:
    Description: What `clovelly-keys init aws --role` names, and what the helper runs as.
    Value: !GetAtt TaskRole.Arn
  LoadBalancerDnsName:
    Description: Point your certificate's name at this with a CNAME.
    Value: !GetAtt LoadBalancer.DNSName
