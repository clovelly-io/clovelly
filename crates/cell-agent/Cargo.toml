[package]
name = "cell-agent"
description = "The cell agent: boot attestation, unlock and the cell API; the in-guest test harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `cell-agent dev-serve`: the cell API without attestation, for local tests against
# runsc. Never enabled in an image build.
dev = []

[dependencies]
anyhow.workspace = true
aws-lc-rs.workspace = true
common = { path = "../common" }
egress-proxy = { path = "../egress-proxy" }
der.workspace = true
rustls.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tonic = { workspace = true, features = ["tls-native-roots"] }
x509-cert.workspace = true
rcgen.workspace = true
reqwest.workspace = true
serde.workspace = true
# Unpacking templates (gzipped tars) safely; DECISIONS.md, phase 4.
flate2 = "1"
tar = { version = "0.4", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tokio-stream = { version = "0.1", default-features = false, features = ["net"] }
# HTTP/2 for the test destination and the in-sandbox client (`dest`, `h2-client`);
# the versions egress-proxy and tonic already use.
bytes = "1"
h2 = "0.4"
http = "1"

[dev-dependencies]
time.workspace = true
tokio = { workspace = true, features = ["test-util"] }
