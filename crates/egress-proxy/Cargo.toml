[package]
name = "egress-proxy"
description = "The egress proxy: the only way out of a sandbox; policy, DNS, TLS termination, credential substitution and the egress log"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
aws-lc-rs.workspace = true
# HTTP/2 inspection (SPEC.md names `h2`); `http` and `bytes` are its request and buffer
# types. All three are already in the tree through tonic.
bytes = "1"
common = { path = "../common" }
h2 = "0.4"
http = "1"
rcgen.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# rcgen's own date type, for the minted certificates' validity.
time.workspace = true
tokio.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }

[target.'cfg(target_os = "linux")'.dependencies]
# SO_ORIGINAL_DST of a redirected connection (SPEC.md names `nix`).
nix = { version = "0.31", default-features = false, features = ["socket", "net"] }
