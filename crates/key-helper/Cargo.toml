[package]
name = "key-helper"
description = "The reference key helpers (docs/key-helper.md): Google Cloud KMS and AWS KMS behind the verifier's one key interface, and the setup that creates their keys"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "clovelly-keys"
path = "src/bin/clovelly-keys.rs"
required-features = ["gcp", "aws"]

[dependencies]
anyhow.workspace = true
aws-config = { workspace = true, optional = true }
aws-sdk-kms = { workspace = true, optional = true }
axum.workspace = true
common = { path = "../common" }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
verifier = { path = "../verifier" }

[features]
default = ["gcp", "aws"]
gcp = ["dep:reqwest"]
aws = ["dep:aws-config", "dep:aws-sdk-kms"]

[dev-dependencies]
aws-lc-rs.workspace = true
