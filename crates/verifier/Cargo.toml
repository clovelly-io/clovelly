[package]
name = "verifier"
description = "The customer's verifier: checks cell attestation, issues cell certificates and releases sub-environment DEKs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
aws-lc-rs.workspace = true
common = { path = "../common" }
der.workspace = true
prost.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tonic.workspace = true
x509-cert.workspace = true

[features]
# The service clock can be moved by CLOVELLY_TEST_CLOCK_OFFSET_SECS. Only the staging test
# image (`verifier-image-test-clock`) is built with it; never a customer's verifier.
test-clock = []
# `LocalKms` and the evidence corpus: test code. No released binary or image is built with
# this (a test scans them for it).
test-keys = []

[dev-dependencies]
rcgen = { workspace = true }
# The integration tests read the corpus types; a normal build of this crate does not get the feature.
verifier = { path = ".", features = ["test-keys"] }
memory-helper = { path = "../memory-helper" }
