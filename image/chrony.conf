# Time from Google's NTP server on the metadata server (SPEC.md "The cell", phase 5).
# Cells booted 7 to 12 s slow without it (phase 4). init.sh sets the clock once with
# `chronyd -q` before the agent starts, then runs chronyd to keep it; no security check
# rests on the clock beyond the lease's 60 s margin.
server metadata.google.internal iburst
# Step, rather than slew, an error over 1 s in the first three updates.
makestep 1 3
# No UDP command port; chronyc talks to chronyd over its Unix socket in /run/chrony.
cmdport 0
